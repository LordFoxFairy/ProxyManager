name: Release desktop installers

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
          - name: macOS x64
            os: macos-13
          - name: Windows x64
            os: windows-latest
          - name: Linux x64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    env:
      CI: true
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify updater signing configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}" || { echo "TAURI_SIGNING_PRIVATE_KEY secret is required"; exit 1; }
          test -n "${TAURI_UPDATER_PUBKEY:-}" || { echo "TAURI_UPDATER_PUBKEY secret is required"; exit 1; }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install workspace dependencies
        run: |
          pnpm install --dir server --frozen-lockfile=false
          pnpm install --dir ui --frozen-lockfile=false

      - name: Sync release version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == "$GITHUB_REF_NAME" ]]; then VERSION="0.1.0"; fi
          VERSION="$VERSION" node -e "const fs=require('fs'); for (const file of ['server/package.json','ui/package.json','ui/src-tauri/tauri.conf.json']) { const data=JSON.parse(fs.readFileSync(file)); data.version=process.env.VERSION; fs.writeFileSync(file, JSON.stringify(data,null,2)+'\\n'); }"

      - name: Build bundled backend
        run: pnpm --dir server bundle

      - name: Bundle Node runtime
        shell: bash
        run: |
          set -euo pipefail
          VERSION=22.14.0
          mkdir -p runtime/node
          case "${{ runner.os }}-${{ runner.arch }}" in
            macOS-ARM64) ARCHIVE="node-v${VERSION}-darwin-arm64.tar.gz"; DIR="node-v${VERSION}-darwin-arm64" ;;
            macOS-X64) ARCHIVE="node-v${VERSION}-darwin-x64.tar.gz"; DIR="node-v${VERSION}-darwin-x64" ;;
            Linux-X64) ARCHIVE="node-v${VERSION}-linux-x64.tar.xz"; DIR="node-v${VERSION}-linux-x64" ;;
            Windows-X64) ARCHIVE="node-v${VERSION}-win-x64.zip"; DIR="node-v${VERSION}-win-x64" ;;
            *) echo "Unsupported runner: ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          curl -fsSL "https://nodejs.org/dist/v${VERSION}/${ARCHIVE}" -o "/tmp/${ARCHIVE}"
          if [[ "${ARCHIVE}" == *.zip ]]; then 7z x "/tmp/${ARCHIVE}" -o/tmp/node-runtime >/dev/null; else mkdir -p /tmp/node-runtime; tar -xf "/tmp/${ARCHIVE}" -C /tmp/node-runtime; fi
          cp -R "/tmp/node-runtime/${DIR}/." runtime/node/

      - name: Bundle Mihomo runtime
        shell: bash
        run: |
          set -euo pipefail
          VERSION=1.19.12
          mkdir -p runtime/mihomo
          case "${{ runner.os }}-${{ runner.arch }}" in
            macOS-ARM64) ASSET="mihomo-darwin-arm64-v${VERSION}.gz" ;;
            macOS-X64) ASSET="mihomo-darwin-amd64-v${VERSION}.gz" ;;
            Linux-X64) ASSET="mihomo-linux-amd64-v${VERSION}.gz" ;;
            Windows-X64) ASSET="mihomo-windows-amd64-v${VERSION}.zip" ;;
            *) echo "Unsupported runner: ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          URL="https://github.com/MetaCubeX/mihomo/releases/download/v${VERSION}/${ASSET}"
          curl -fsSL "$URL" -o "/tmp/${ASSET}"
          if [[ "${ASSET}" == *.zip ]]; then 7z e "/tmp/${ASSET}" -o runtime/mihomo -y >/dev/null; else gzip -dc "/tmp/${ASSET}" > runtime/mihomo/mihomo; chmod +x runtime/mihomo/mihomo; fi

      - name: Smoke test bundled runtimes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            NODE="runtime/node/node.exe"
            MIHOMO="runtime/mihomo/mihomo.exe"
          else
            NODE="runtime/node/bin/node"
            MIHOMO="runtime/mihomo/mihomo"
            chmod +x "$NODE" "$MIHOMO"
          fi
          test -x "$NODE" || test -f "$NODE"
          test -f server/bundle/cli.js
          PM_DB="$RUNNER_TEMP/proxymanager-smoke.db" "$NODE" server/bundle/cli.js stats >/tmp/proxymanager-stats.json
          grep -q '"total"' /tmp/proxymanager-stats.json
          "$MIHOMO" -v

      - name: Smoke test bundled backend API
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            NODE="runtime/node/node.exe"
          else
            NODE="runtime/node/bin/node"
          fi
          PM_DB="$RUNNER_TEMP/proxymanager-api-smoke.db" "$NODE" server/bundle/cli.js stats >/dev/null
          PM_DB="$RUNNER_TEMP/proxymanager-api-smoke.db" "$NODE" server/scripts/api-smoke.mjs "$NODE" server/bundle/cli.js 18787

      - name: Build and publish Tauri installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ui
          tagName: ${{ github.ref_name }}
          releaseName: ProxyManager ${{ github.ref_name }}
          releaseBody: |
            Cross-platform ProxyManager desktop installers.
            
            This release includes the bundled control plane and Tauri desktop shell.
          releaseDraft: false
          prerelease: false
          args: "--config {\"plugins\":{\"updater\":{\"pubkey\":\"${{ secrets.TAURI_UPDATER_PUBKEY }}\"}}}"
